services:
  hub:
    build: .
    container_name: hub
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      APP_NAME: hub
      APP_ENV: production
      APP_ADDR: 0.0.0.0:8080
      APP_BASE_URL: http://localhost:8080
      DATABASE_PATH: /app/data/hub.db
      REDIS_ADDR: redis:6379
      HUB_SECRET_KEY: change-this-secret
      BACKUP_DIR: /app/backups
      TRUST_PROXY: "false"
    volumes:
      - hub-data:/app/data
      - hub-backups:/app/backups
    depends_on:
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: hub-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data

volumes:
  hub-data:
  hub-backups:
  redis-data:
