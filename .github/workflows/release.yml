name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-binaries:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]

    env:
      VERSION: ${{ github.ref_name }}
      COMMIT: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Build binary
        run: |
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          mkdir -p dist
          GOOS=linux GOARCH=${{ matrix.goarch }} CGO_ENABLED=0 go build -trimpath -ldflags="-s -w -X github.com/AmooVPN/hub/internal/version.Version=${VERSION} -X github.com/AmooVPN/hub/internal/version.Commit=${COMMIT} -X github.com/AmooVPN/hub/internal/version.Date=${DATE}" -o dist/hub-linux-${{ matrix.goarch }} ./cmd/hub

      - name: Create checksum
        run: sha256sum dist/hub-linux-${{ matrix.goarch }} > dist/hub-linux-${{ matrix.goarch }}.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hub-linux-${{ matrix.goarch }}
          path: dist/*

  build-docker:
    runs-on: ubuntu-latest

    env:
      VERSION: ${{ github.ref_name }}
      COMMIT: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image archive
        run: |
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          mkdir -p dist
          docker build --build-arg VERSION="${VERSION}" --build-arg COMMIT="${COMMIT}" --build-arg DATE="${DATE}" -t hub:${VERSION} .
          docker save hub:${VERSION} -o dist/hub-docker.tar

      - name: Create checksum
        run: sha256sum dist/hub-docker.tar > dist/hub-docker.tar.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hub-docker
          path: dist/*

  publish:
    runs-on: ubuntu-latest
    needs:
      - build-binaries
      - build-docker

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release

      - name: Flatten assets
        run: |
          mkdir -p dist
          find release -type f -exec cp {} dist/ \;

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
